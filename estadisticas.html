<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CineData - Estadísticas</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <header class="cabecera">
    <h1>🎬 CineData</h1>
  </header>

  <nav class="nav-principal" aria-label="Principal">
    <a href="index.html">Películas</a>
    <a href="estadisticas.html" class="activo" aria-current="page">Estadísticas</a>
  </nav>

  <main class="panel">
    <h2>Estadísticas por género</h2>

    <form id="form-estadisticas" class="filtros">
      <label for="minimo">Mínimo de películas por género</label>
      <input type="number" id="minimo" name="minimo" placeholder="Opcional" min="1" max="50" step="1">
      <button type="submit">Filtrar</button>
    </form>

    <p id="estado" class="estado"></p>
    <ul id="detalles" class="detalles" hidden></ul>
    <section id="resultados" class="rejilla"></section>
  </main>

  <script type="module" src="js/estadisticas.js"></script>
</body>
</html>
