<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CineData</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <header class="cabecera">
    <h1>🎬 CineData</h1>

    <form id="form-login" class="login">
      <input type="email" name="email" placeholder="email" value="ana@lab.com" required>
      <input type="password" name="password" placeholder="contraseña" value="ana123" required>
      <button type="submit">Entrar</button>
    </form>

    <div id="sesion" class="sesion" hidden>
      <span id="saludo"></span>
      <button id="btn-salir">Salir</button>
    </div>
  </header>

  <nav class="nav-principal" aria-label="Principal">
    <a href="index.html" class="activo" aria-current="page">Películas</a>
    <a href="estadisticas.html">Estadísticas</a>
  </nav>

  <main class="panel">
    <form id="form-filtros" class="filtros">
      <select name="genero">
        <option value="">Todos los géneros</option>
        <option>Drama</option>
        <option>Ciencia ficción</option>
        <option>Animación</option>
        <option>Aventura</option>
        <option>Fantasía</option>
      </select>
      <input type="number" name="notaMin" placeholder="Nota mínima" min="0" max="10" step="0.1">
      <select name="orden">
        <option value="nota">Mejor nota</option>
        <option value="anio">Más recientes</option>
        <option value="titulo">Título A-Z</option>
      </select>
      <button type="submit">Filtrar</button>
    </form>

    <p id="estado" class="estado"></p>
    <section id="rejilla" class="rejilla"></section>

    <nav class="paginacion">
      <button id="btn-anterior">← Anterior</button>
      <span id="info-pagina"></span>
      <button id="btn-siguiente">Siguiente →</button>
    </nav>

    <section id="panel-resenas" class="resenas" hidden>
      <h2 id="titulo-resenas"></h2>
      <ul id="lista-resenas"></ul>
      <form id="form-resena" class="form-resena">
        <input name="texto" placeholder="¿Qué te ha parecido?" required>
        <select name="estrellas">
          <option>5</option><option>4</option><option>3</option><option>2</option><option>1</option>
        </select>
        <button type="submit">Publicar</button>
      </form>
    </section>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
